<script>
    function toggleMobileMenu() {
        const menu = document.getElementById('mobile-menu');
        const icon = document.querySelector('#mobile-menu-toggle-btn [data-icon="menu"], #mobile-menu-toggle-btn .material-symbols-outlined');
        if (menu.classList.contains('hidden')) {
            menu.classList.remove('hidden');
            menu.classList.add('flex');
            if (icon) icon.textContent = 'close';
        } else {
            menu.classList.add('hidden');
            menu.classList.remove('flex');
            if (icon) icon.textContent = 'menu';
        }
    }

    window.env = {};
    (async function() {
      try {
        const responseJson = await fetch('/env-public.json');
        if (responseJson.ok) {
          window.env = await responseJson.json();
        }
      } catch (e) {
        console.warn('Environment loading error:', e);
      } finally {
        window.envLoaded = true;
        window.dispatchEvent(new CustomEvent('envLoaded'));
      }
    })();
  </script>
