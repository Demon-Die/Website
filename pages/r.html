  <script>
    window.env = {};
    (async function() {
      try {
        const responseJson = await fetch('/env-public.json');
        if (responseJson.ok) {
          window.env = await responseJson.json();
        }
      } catch (e) {
        console.warn('Environment loading error:', e);
      } finally {
        window.envLoaded = true;
        window.dispatchEvent(new CustomEvent('envLoaded'));
      }
    })();
  </script>
