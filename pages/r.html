<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting | Omnikon</title>
  <link rel="stylesheet" href="../assets/tailwind.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-background text-on-surface font-sans min-h-screen flex items-center justify-center">
  <div class="text-center flex flex-col items-center">
    <div class="w-12 h-12 border-4 border-primary border-t-transparent rounded-full animate-spin mb-6"></div>
    <h1 class="text-xl font-headline-mono text-primary animate-pulse">INITIATING_SECURE_TRANSFER</h1>
    <p class="text-on-surface-variant font-mono mt-2 text-sm">Please wait while we establish a secure connection...</p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <script>
    window.env = {};
    (async function() {
      try {
        const responseJson = await fetch('/env-public.json');
        if (responseJson.ok) {
          window.env = await responseJson.json();
        }
      } catch (e) {
        console.warn('Environment loading error:', e);
      } finally {
        window.envLoaded = true;
        window.dispatchEvent(new CustomEvent('envLoaded'));
      }
    })();
  </script>

  <script type="module" src="../assets/referral-redirect.js"></script>
</body>
</html>
